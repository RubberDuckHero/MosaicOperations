<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Arena Ball - Menu</title>
    <link rel="stylesheet" href="./src/style.css"/>
</head>
<body>
    <div id="app" class="app">
        <h1>Arena Ball</h1>
        <div id="menu" class="menu">
            <button id="lobbyBtn">Show Lobby</button>
            <button id="exitBtn">Exit</button>
        </div>
        <div id="lobby" class="lobby" style="display:none;">
            <h2>Game Lobby</h2>
            <ul id="gameList"></ul>
            <button id="createBtn">Create New Game</button>
            <button id="backBtn">Back to Menu</button>
        </div>
        <div id="game" class="game" style="display:none;">
            <h2>Game: <span id="gameId"></span></h2>
            <pre id="state"></pre>
            <button id="backToLobbyBtn">Back to Lobby</button>
        </div>
    </div>
    <script src="./src/main.js"></script>
</body>
</html>
